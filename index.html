<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LadiesTravel Management System</title>
    
    <!-- Load React & ReactDOM (Versi Stabil 18.2.0) -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    
    <!-- Load Prop-types (Penting untuk mencegah error pada beberapa library UMD) -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    
    <!-- Load Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load Recharts (Versi Stabil 2.12.7 - Versi terbaru sering bermasalah di UMD) -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <style>
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        // Pastikan Recharts terdefinisi sebelum destructuring
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, Legend, ResponsiveContainer, AreaChart, Area } = window.Recharts || {};

        // --- ICONS (Inline SVG Components to replace Lucide imports) ---
        const IconBase = ({ d, ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                {d}
            </svg>
        );

        const Bus = (p) => <IconBase {...p} d={<><path d="M8 6v6" /><path d="M15 6v6" /><path d="M2 12h19.6" /><path d="M18 21v-2" /><path d="M6 21v-2" /><rect width="22" height="16" x="1" y="5" rx="2" /></>} />;
        const LayoutDashboard = (p) => <IconBase {...p} d={<><rect width="7" height="9" x="3" y="3" rx="1" /><rect width="7" height="5" x="14" y="3" rx="1" /><rect width="7" height="9" x="14" y="12" rx="1" /><rect width="7" height="5" x="3" y="16" rx="1" /></>} />;
        const Users = (p) => <IconBase {...p} d={<><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="M22 21v-2a4 4 0 0 0-3-3.87" /><path d="M16 3.13a4 4 0 0 1 0 7.75" /></>} />;
        const Wallet = (p) => <IconBase {...p} d={<><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" /><path d="M3 5v14a2 2 0 0 0 2 2h16v-5" /><path d="M18 12a2 2 0 0 0 0 4h4v-4Z" /></>} />;
        const Receipt = (p) => <IconBase {...p} d={<><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z" /><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8" /><path d="M12 17V7" /></>} />;
        const TrendingUp = (p) => <IconBase {...p} d={<><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></>} />;
        const TrendingDown = (p) => <IconBase {...p} d={<><polyline points="22 17 13.5 8.5 8.5 13.5 2 7" /><polyline points="16 17 22 17 22 11" /></>} />;
        const LogOut = (p) => <IconBase {...p} d={<><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" x2="9" y1="12" y2="12" /></>} />;
        const Plus = (p) => <IconBase {...p} d={<><path d="M5 12h14" /><path d="M12 5v14" /></>} />;
        const FileText = (p) => <IconBase {...p} d={<><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /><path d="M10 9H8" /><path d="M16 13H8" /><path d="M16 17H8" /></>} />;
        const Calendar = (p) => <IconBase {...p} d={<><rect width="18" height="18" x="3" y="4" rx="2" ry="2" /><line x1="16" x2="16" y1="2" y2="6" /><line x1="8" x2="8" y1="2" y2="6" /><line x1="3" x2="21" y1="10" y2="10" /></>} />;
        const Filter = (p) => <IconBase {...p} d={<><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" /></>} />;
        const Search = (p) => <IconBase {...p} d={<><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></>} />;
        const Trash2 = (p) => <IconBase {...p} d={<><path d="M3 6h18" /><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" /><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" /><line x1="10" x2="10" y1="11" y2="17" /><line x1="14" x2="14" y1="11" y2="17" /></>} />;
        const Printer = (p) => <IconBase {...p} d={<><polyline points="6 9 6 2 18 2 18 9" /><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" /><rect width="12" height="8" x="6" y="14" /></>} />;
        const ChevronRight = (p) => <IconBase {...p} d={<><path d="m9 18 6-6-6-6" /></>} />;
        const UserCircle = (p) => <IconBase {...p} d={<><circle cx="12" cy="12" r="10" /><circle cx="12" cy="10" r="3" /><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662" /></>} />;
        const CheckCircle = (p) => <IconBase {...p} d={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" /><polyline points="22 4 12 14.01 9 11.01" /></>} />;
        const MapPin = (p) => <IconBase {...p} d={<><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></>} />;
        const Fuel = (p) => <IconBase {...p} d={<><line x1="3" x2="15" y1="22" y2="22" /><line x1="4" x2="14" y1="9" y2="9" /><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18" /><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 2 2h0a2 2 0 0 0 2-2V9.83a2 2 0 0 0-.59-1.42L18 5" /></>} />;
        const Package = (p) => <IconBase {...p} d={<><path d="m16.5 9.4-9-5.19" /><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" /><polyline points="3.27 6.96 12 12.01 20.73 6.96" /><line x1="12" x2="12" y1="22.08" y2="12" /></>} />;
        const X = (p) => <IconBase {...p} d={<><path d="M18 6 6 18" /><path d="m6 6 12 12" /></>} />;
        const CreditCard = (p) => <IconBase {...p} d={<><rect width="20" height="14" x="2" y="5" rx="2" /><line x1="2" x2="22" y1="10" y2="10" /></>} />;
        const User = (p) => <IconBase {...p} d={<><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></>} />;

        // --- UTILITIES ---
        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(amount);
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);

        const formatDate = (dateString) => {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('id-ID', options);
        };

        const getTodayDate = () => new Date().toISOString().split('T')[0];

        // --- DATA SEEDING ---
        const seedData = () => {
            if (!localStorage.getItem('travel_users')) {
                const users = [
                    { id: 'u1', name: 'Santi Aprofitasari', username: 'admin', password: '123', role: 'admin', active: true },
                    { id: 'u2', name: 'Siti Tiket', username: 'staff', password: '123', role: 'staff', active: true },
                ];
                localStorage.setItem('travel_users', JSON.stringify(users));
            }

            if (!localStorage.getItem('travel_vehicles')) {
                const vehicles = [
                    { id: 'v1', plate: 'B 1234 XYZ', name: 'HiAce Commuter 01', type: 'Minibus', year: '2020', status: 'Aktif' },
                    { id: 'v2', plate: 'D 5678 ABC', name: 'Elf Long 02', type: 'Microbus', year: '2019', status: 'Servis' },
                ];
                localStorage.setItem('travel_vehicles', JSON.stringify(vehicles));
            }
        };

        // --- COMPONENTS ---
        const Card = ({ title, value, subtext, icon: Icon, colorClass }) => (
            <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-start justify-between">
                <div>
                    <p className="text-slate-500 text-sm font-medium mb-1">{title}</p>
                    <h3 className="text-2xl font-bold text-slate-800">{value}</h3>
                    {subtext && <p className={`text-xs mt-2 ${colorClass}`}>{subtext}</p>}
                </div>
                <div className={`p-3 rounded-lg ${colorClass} bg-opacity-10`}>
                    <Icon className={`w-6 h-6 ${colorClass.replace('text-', 'stroke-')}`} />
                </div>
            </div>
        );

        const Modal = ({ isOpen, onClose, title, children, maxWidth = "max-w-2xl" }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 transition-all">
                    <div className={`bg-white rounded-2xl shadow-2xl w-full ${maxWidth} max-h-[90vh] overflow-y-auto border border-slate-100`}>
                        <div className="flex justify-between items-center p-6 border-b border-slate-100 sticky top-0 bg-white/95 backdrop-blur z-20">
                            <div>
                                <h2 className="text-xl font-bold text-slate-800">{title}</h2>
                                <p className="text-xs text-slate-400 mt-1">Lengkapi formulir di bawah ini</p>
                            </div>
                            <button onClick={onClose} className="p-2 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors">
                                <X className="w-5 h-5" />
                            </button>
                        </div>
                        <div className="p-6 bg-slate-50/50 min-h-[400px]">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        function TravelApp() {
            const [user, setUser] = useState(null); 
            const [view, setView] = useState('dashboard');
            const [users, setUsers] = useState([]);
            const [vehicles, setVehicles] = useState([]);
            const [transactions, setTransactions] = useState([]);
            
            // Login & Register State
            const [isRegistering, setIsRegistering] = useState(false);
            const [authForm, setAuthForm] = useState({ name: '', username: '', password: '' });
            const [authError, setAuthError] = useState('');
            const [authSuccess, setAuthSuccess] = useState('');

            // Modals
            const [showVehicleModal, setShowVehicleModal] = useState(false);
            const [showTransModal, setShowTransModal] = useState(false);
            
            // Forms
            const [vehicleForm, setVehicleForm] = useState({});
            const [transForm, setTransForm] = useState({
                type: 'income_driver', 
                date: getTodayDate(),
                amount: 0, 
                vehicleId: '',
                description: '',
                driverName: '',
                origin: '',        
                destination: '',   
                incomeItems: [], 
                costBBM: 0,
                costTol: 0,
                costDriver: 0,     
                paymentMethod: 'Cash',
                expenseType: 'BBM', 
                salaryRecipient: '',
                route: '' 
            });

            // Filter State
            const [dateFilter, setDateFilter] = useState({ start: '', end: '' });
            const [selectedVehicleFilter, setSelectedVehicleFilter] = useState('all');

            // --- EFFECTS ---
            useEffect(() => {
                seedData();
                const storedUser = localStorage.getItem('travel_currentUser');
                if (storedUser) setUser(JSON.parse(storedUser));
                setUsers(JSON.parse(localStorage.getItem('travel_users') || '[]'));
                setVehicles(JSON.parse(localStorage.getItem('travel_vehicles') || '[]'));
                setTransactions(JSON.parse(localStorage.getItem('travel_transactions') || '[]'));
            }, []);

            useEffect(() => {
                localStorage.setItem('travel_vehicles', JSON.stringify(vehicles));
                localStorage.setItem('travel_users', JSON.stringify(users));
                localStorage.setItem('travel_transactions', JSON.stringify(transactions));
            }, [vehicles, users, transactions]);

            // --- ACTIONS ---
            useEffect(() => {
                if (transForm.type === 'income_driver') {
                    const grossIncome = transForm.incomeItems.reduce((acc, item) => acc + (parseFloat(item.price) || 0), 0);
                    const totalCommission = transForm.incomeItems.reduce((acc, item) => acc + (parseFloat(item.commission) || 0), 0);
                    const tripCosts = parseFloat(transForm.costBBM || 0) + parseFloat(transForm.costTol || 0) + parseFloat(transForm.costDriver || 0);
                    const net = grossIncome - totalCommission - tripCosts;
                    setTransForm(prev => ({ ...prev, amount: net }));
                }
            }, [transForm.incomeItems, transForm.costBBM, transForm.costTol, transForm.costDriver, transForm.type]);

            const addIncomeItem = () => {
                setTransForm(prev => ({
                    ...prev,
                    incomeItems: [...prev.incomeItems, { id: generateId(), type: 'Penumpang', desc: '', supplier: '', price: 0, commission: 0 }]
                }));
            };

            const removeIncomeItem = (id) => {
                setTransForm(prev => ({ ...prev, incomeItems: prev.incomeItems.filter(item => item.id !== id) }));
            };

            const updateIncomeItem = (id, field, value) => {
                setTransForm(prev => ({
                    ...prev,
                    incomeItems: prev.incomeItems.map(item => item.id === id ? { ...item, [field]: value } : item)
                }));
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const foundUser = users.find(u => u.username === authForm.username && u.password === authForm.password && u.active);
                if (foundUser) {
                    setUser(foundUser);
                    localStorage.setItem('travel_currentUser', JSON.stringify(foundUser));
                    setAuthError('');
                    setView('dashboard');
                } else {
                    setAuthError('Username atau password salah / akun nonaktif');
                }
            };

            const handleRegister = (e) => {
                e.preventDefault();
                if (users.find(u => u.username === authForm.username)) {
                    setAuthError('Username sudah digunakan!');
                    return;
                }
                const newUser = { id: generateId(), name: authForm.name, username: authForm.username, password: authForm.password, role: 'staff', active: true };
                setUsers([...users, newUser]);
                setAuthSuccess('Registrasi berhasil! Silakan login.');
                setIsRegistering(false);
                setAuthForm({ name: '', username: '', password: '' });
                setAuthError('');
            };

            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem('travel_currentUser');
                setAuthForm({ name: '', username: '', password: '' });
            };

            const saveVehicle = (e) => {
                e.preventDefault();
                if (vehicleForm.id) {
                    setVehicles(vehicles.map(v => v.id === vehicleForm.id ? vehicleForm : v));
                } else {
                    setVehicles([...vehicles, { ...vehicleForm, id: generateId() }]);
                }
                setShowVehicleModal(false);
            };

            const saveTransaction = (e) => {
                e.preventDefault();
                let desc = transForm.description;
                if (transForm.type === 'income_driver') {
                    const pnpCount = transForm.incomeItems.filter(i => i.type === 'Penumpang').length;
                    const pktCount = transForm.incomeItems.filter(i => i.type === 'Paket').length;
                    desc = `Trip: ${transForm.origin} - ${transForm.destination} (${pnpCount} Pnp, ${pktCount} Pkt)`;
                } else if (transForm.type === 'salary' && !desc) {
                    desc = `Gaji ${transForm.salaryRecipient}`;
                } else if (transForm.type === 'income_ticket') {
                    desc = `Tiket: ${transForm.route}`;
                }
                const newTrans = {
                    ...transForm,
                    description: desc,
                    id: generateId(),
                    amount: parseFloat(transForm.amount),
                    costBBM: parseFloat(transForm.costBBM || 0),
                    costTol: parseFloat(transForm.costTol || 0),
                    costDriver: parseFloat(transForm.costDriver || 0),
                    timestamp: new Date().toISOString()
                };
                setTransactions([newTrans, ...transactions]);
                setShowTransModal(false);
                setTransForm({
                    type: 'income_driver', date: getTodayDate(), amount: 0, vehicleId: '', description: '',
                    driverName: '', origin: '', destination: '',
                    incomeItems: [],
                    costBBM: 0, costTol: 0, costDriver: 0,
                    paymentMethod: 'Cash', expenseType: 'BBM', salaryRecipient: '', route: ''
                });
            };

            const deleteTransaction = (id) => {
                if(confirm('Hapus transaksi ini?')) {
                    setTransactions(transactions.filter(t => t.id !== id));
                }
            }

            const deleteUser = (id) => {
                if (id === user.id) {
                    alert("Anda tidak dapat menghapus akun Anda sendiri saat sedang login.");
                    return;
                }
                if (confirm('Apakah Anda yakin ingin menghapus akun pegawai ini secara permanen?')) {
                    setUsers(users.filter(u => u.id !== id));
                }
            };

            const filteredTransactions = useMemo(() => {
                return transactions.filter(t => {
                    const dateMatch = (!dateFilter.start || t.date >= dateFilter.start) && (!dateFilter.end || t.date <= dateFilter.end);
                    const vehicleMatch = selectedVehicleFilter === 'all' || t.vehicleId === selectedVehicleFilter;
                    return dateMatch && vehicleMatch;
                });
            }, [transactions, dateFilter, selectedVehicleFilter]);

            const stats = useMemo(() => {
                let incomeDriver = 0, incomeTicket = 0, totalExpense = 0;
                filteredTransactions.forEach(t => {
                    if (t.type === 'income_driver') incomeDriver += t.amount;
                    if (t.type === 'income_ticket') incomeTicket += t.amount;
                    if (t.type === 'expense' || t.type === 'salary') totalExpense += t.amount;
                });
                return { incomeDriver, incomeTicket, totalIncome: incomeDriver + incomeTicket, totalExpense, netProfit: (incomeDriver + incomeTicket) - totalExpense };
            }, [filteredTransactions]);

            const chartData = useMemo(() => {
                const dataMap = {};
                filteredTransactions.forEach(t => {
                    if (!dataMap[t.date]) dataMap[t.date] = { date: t.date, income: 0, expense: 0 };
                    if (t.type.includes('income')) dataMap[t.date].income += t.amount;
                    if (t.type === 'expense' || t.type === 'salary') dataMap[t.date].expense += t.amount;
                });
                return Object.values(dataMap).sort((a, b) => new Date(a.date) - new Date(b.date));
            }, [filteredTransactions]);

            if (!user) {
                return (
                    <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
                            <div className="flex justify-center mb-6">
                                <div className="bg-blue-600 p-3 rounded-xl"><Bus className="w-8 h-8 text-white" /></div>
                            </div>
                            <h2 className="text-2xl font-bold text-center text-slate-800 mb-2">{isRegistering ? 'Daftar Pegawai Baru' : 'LadiesTravel Login'}</h2>
                            <p className="text-center text-slate-500 mb-6">{isRegistering ? 'Buat akun untuk akses sistem tiket' : 'Masuk untuk mengelola armada'}</p>
                            {authSuccess && <div className="bg-green-100 text-green-700 p-3 rounded-lg mb-4 text-sm flex items-center gap-2"><CheckCircle className="w-4 h-4" /> {authSuccess}</div>}
                            <form onSubmit={isRegistering ? handleRegister : handleLogin} className="space-y-4">
                                {isRegistering && <div><label className="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label><input type="text" required className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Nama Pegawai" value={authForm.name} onChange={e => setAuthForm({...authForm, name: e.target.value})} /></div>}
                                <div><label className="block text-sm font-medium text-slate-700 mb-1">Username</label><input type="text" required className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Username" value={authForm.username} onChange={e => setAuthForm({...authForm, username: e.target.value})} /></div>
                                <div><label className="block text-sm font-medium text-slate-700 mb-1">Password</label><input type="password" required className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Password" value={authForm.password} onChange={e => setAuthForm({...authForm, password: e.target.value})} /></div>
                                {authError && <p className="text-red-500 text-sm text-center">{authError}</p>}
                                <button type="submit" className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">{isRegistering ? 'Daftar Sekarang' : 'Masuk'}</button>
                            </form>
                            <div className="mt-6 text-center pt-4 border-t"><button onClick={() => { setIsRegistering(!isRegistering); setAuthError(''); setAuthSuccess(''); }} className="text-sm text-blue-600 hover:underline font-medium">{isRegistering ? 'Sudah punya akun? Login' : 'Pegawai baru? Daftar Akun'}</button></div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col md:flex-row font-sans text-slate-800">
                    <aside className="w-full md:w-64 bg-slate-900 text-white flex-shrink-0 z-30">
                        <div className="p-6 flex items-center gap-3 border-b border-slate-700">
                            <div className="bg-blue-500 p-2 rounded-lg"><Bus className="w-5 h-5 text-white" /></div>
                            <span className="font-bold text-xl tracking-tight">LadiesTravel</span>
                        </div>
                        <nav className="p-4 space-y-2">
                            <button onClick={() => setView('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition ${view === 'dashboard' ? 'bg-blue-600' : 'hover:bg-slate-800'}`}><LayoutDashboard className="w-5 h-5" /> <span>Dashboard</span></button>
                            <button onClick={() => { setView('finance'); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition ${view === 'finance' ? 'bg-blue-600' : 'hover:bg-slate-800'}`}><Wallet className="w-5 h-5" /> <span>Keuangan (Kas)</span></button>
                            {user.role === 'admin' && (
                                <>
                                    <button onClick={() => setView('vehicles')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition ${view === 'vehicles' ? 'bg-blue-600' : 'hover:bg-slate-800'}`}><Bus className="w-5 h-5" /> <span>Armada Kendaraan</span></button>

                                                            <div className="col-span-3"><label className="text-[10px] font-bold text-slate-400 uppercase">Tipe</label><select className="text-xs border-0 bg-slate-50 rounded p-1.5 w-full font-medium text-slate-700" value={item.type} onChange={e => updateIncomeItem(item.id, 'type', e.target.value)}><option>Penumpang</option><option>Paket</option></select></div>
                                                            <div className="col-span-5"><label className="text-[10px] font-bold text-slate-400 uppercase">Nama / Ket</label><input className="text-xs border-b border-slate-200 focus:border-blue-500 bg-transparent p-1.5 w-full outline-none" placeholder="Nama..." value={item.desc} onChange={e => updateIncomeItem(item.id, 'desc', e.target.value)} /></div>
                                                            <div className="col-span-4"><label className="text-[10px] font-bold text-slate-400 uppercase text-right block">Harga</label><input type="number" className="text-xs border-b border-slate-200 focus:border-blue-500 bg-transparent p-1.5 w-full text-right font-bold text-slate-700 outline-none" placeholder="0" value={item.price} onChange={e => updateIncomeItem(item.id, 'price', e.target.value)} /></div>
                                                        </div>
                                                        <div className="grid grid-cols-12 gap-2">
                                                            <div className="col-span-8"><div className="flex items-center gap-2 bg-slate-50 rounded px-2 py-1"><Users className="w-3 h-3 text-slate-400" /><input className="text-xs bg-transparent border-0 w-full outline-none text-slate-600 placeholder:text-slate-300" placeholder="Pemasok (Opsional)" value={item.supplier} onChange={e => updateIncomeItem(item.id, 'supplier', e.target.value)} /></div></div>
                                                            <div className="col-span-4 flex items-center gap-2"><div className="flex items-center gap-1 bg-red-50 rounded px-2 py-1 flex-1"><span className="text-[10px] text-red-400 font-bold">-</span><input type="number" className="text-xs bg-transparent border-0 w-full outline-none text-red-600 text-right font-medium placeholder:text-red-200" placeholder="Komisi" value={item.commission} onChange={e => updateIncomeItem(item.id, 'commission', e.target.value)} /></div></div>
                                                        </div>
                                                        <button type="button" onClick={() => removeIncomeItem(item.id)} className="absolute -top-2 -right-2 bg-white text-slate-300 hover:text-red-500 hover:bg-red-50 p-1 rounded-full shadow border border-slate-100 opacity-0 group-hover:opacity-100 transition-all"><X className="w-3 h-3"/></button>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="mt-4 pt-3 border-t border-blue-200 flex justify-between items-center"><span className="text-xs text-blue-600 font-medium">Total Kotor (Gross)</span><span className="font-bold text-blue-800 text-base">{formatCurrency(transForm.incomeItems.reduce((acc, i) => acc + (parseFloat(i.price)||0), 0))}</span></div>
                                        </div>
                                    </div>
                                    <div className="space-y-4">
                                        <div className="bg-rose-50/50 p-5 rounded-xl border border-rose-100 shadow-sm">
                                            <h4 className="font-bold text-rose-800 flex items-center gap-2 mb-4 text-sm uppercase tracking-wide border-b border-rose-200 pb-2"><Fuel className="w-4 h-4"/> Pengeluaran Jalan</h4>
                                            <div className="grid grid-cols-2 gap-4">
                                                <div> <label className="label-text text-rose-700">BBM</label> <div className="relative"><span className="absolute left-3 top-2.5 text-xs font-bold text-rose-300">Rp</span><input type="number" className="input-field pl-8 border-rose-200 focus:border-rose-500 focus:ring-rose-500/10" placeholder="0" value={transForm.costBBM} onChange={e => setTransForm({...transForm, costBBM: e.target.value})} /> </div></div>
                                                <div> <label className="label-text text-rose-700">Tol / Parkir</label> <div className="relative"><span className="absolute left-3 top-2.5 text-xs font-bold text-rose-300">Rp</span><input type="number" className="input-field pl-8 border-rose-200 focus:border-rose-500 focus:ring-rose-500/10" placeholder="0" value={transForm.costTol} onChange={e => setTransForm({...transForm, costTol: e.target.value})} /> </div></div>
                                                <div className="col-span-2"> <label className="label-text text-rose-700">Uang Makan / Saku Supir</label> <div className="relative"><span className="absolute left-3 top-2.5 text-xs font-bold text-rose-300">Rp</span><input type="number" className="input-field pl-8 border-rose-200 focus:border-rose-500 focus:ring-rose-500/10" placeholder="0" value={transForm.costDriver} onChange={e => setTransForm({...transForm, costDriver: e.target.value})} /> </div></div>
                                            </div>
                                        </div>
                                        <div className="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-6 text-white shadow-xl relative overflow-hidden">
                                            <div className="absolute top-0 right-0 p-4 opacity-10"><Wallet className="w-24 h-24" /></div>
                                            <div className="relative z-10"><p className="text-slate-400 text-sm font-medium mb-1">Total Setoran Bersih</p><p className="text-xs text-slate-500 mb-4">(Kotor - Komisi - Biaya Jalan)</p><div className="text-4xl font-bold tracking-tight">{formatCurrency(transForm.amount)}</div></div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {transForm.type !== 'income_driver' && (
                                <div className="space-y-4 max-w-xl mx-auto">
                                    {transForm.type === 'income_ticket' && (<div className="grid grid-cols-2 gap-4"><div> <label className="label-text">Rute</label> <input required className="input-field" value={transForm.route} onChange={e => setTransForm({...transForm, route: e.target.value})} /> </div><div> <label className="label-text">Metode Bayar</label> <select className="input-field" value={transForm.paymentMethod} onChange={e => setTransForm({...transForm, paymentMethod: e.target.value})}> <option>Cash</option> <option>Transfer</option> <option>QRIS</option> </select> </div></div>)}
                                    {transForm.type === 'expense' && (<div> <label className="label-text">Jenis Pengeluaran</label> <select className="input-field" value={transForm.expenseType} onChange={e => setTransForm({...transForm, expenseType: e.target.value})}> <option>BBM</option> <option>Tol</option> <option>Parkir</option> <option>Servis</option> <option>Sparepart</option> <option>Pajak/STNK</option> <option>Lainnya</option> </select> </div>)}
                                    {transForm.type === 'salary' && (<div> <label className="label-text">Penerima Gaji</label> <input list="staff-list" required className="input-field" placeholder="Nama Pegawai/Supir" value={transForm.salaryRecipient} onChange={e => setTransForm({...transForm, salaryRecipient: e.target.value})} /> <datalist id="staff-list"> {users.map(u => <option key={u.id} value={u.name} />)} </datalist> </div>)}
                                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200"> <label className="label-text mb-2">Total Nominal (Rp)</label> <input required type="number" className="input-field text-2xl font-bold text-slate-800 h-14" placeholder="0" value={transForm.amount} onChange={e => setTransForm({...transForm, amount: e.target.value})} /> </div>
                                    <div> <label className="label-text">Keterangan</label> <textarea className="input-field" rows="3" value={transForm.description} onChange={e => setTransForm({...transForm, description: e.target.value})}></textarea> </div>
                                </div>
                            )}

                            <div className="pt-4 border-t sticky bottom-0 bg-white/95 backdrop-blur py-4 -mb-2 z-20">
                                <button type="submit" className={`w-full py-4 rounded-xl font-bold text-white text-lg shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 flex items-center justify-center gap-2 ${transForm.type.includes('expense') || transForm.type === 'salary' ? 'bg-gradient-to-r from-red-600 to-red-700' : 'bg-gradient-to-r from-blue-600 to-blue-700'}`}> <CheckCircle className="w-6 h-6" /> Simpan Transaksi </button>
                            </div>
                        </form>
                    </Modal>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TravelApp />);
    </script>
</body>
</html>
